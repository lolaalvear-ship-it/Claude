<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f3b52"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="60" width="34" height="250" rx="4" fill="#305496"/><text x="32" y="185.0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" transform="rotate(-90 32 185.0)" text-anchor="middle">Identificación</text><rect x="10" y="330" width="34" height="600" rx="4" fill="#305496"/><text x="32" y="630.0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" transform="rotate(-90 32 630.0)" text-anchor="middle">Cribado</text><rect x="10" y="950" width="34" height="200" rx="4" fill="#305496"/><text x="32" y="1050.0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" transform="rotate(-90 32 1050.0)" text-anchor="middle">Incluidos</text><text x="500" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b2230">Diagrama de flujo PRISMA 2020 — búsqueda del 5 de noviembre de 2026</text><rect x="60" y="60" width="420" height="150" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="72" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Registros identificados en bases de datos</text><text x="72" y="101" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">(n = 4144)</text><text x="72" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  PubMed/MEDLINE: n = 2798</text><text x="72" y="139" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Europe PMC: n = 1346</text><text x="72" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Scopus, WoS, Embase, Cochrane,</text><text x="72" y="177" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  LILACS, SciELO: [pendiente de ejecución]</text><rect x="540" y="60" width="420" height="150" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="82" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Registros eliminados antes del cribado</text><text x="552" y="101" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Duplicados: n = 1115</text><text x="552" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Marcados por automatización: n = 0</text><text x="552" y="139" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Otras razones: n = 0</text><line x1="480" y1="135" x2="540" y2="135" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="230" width="420" height="65" rx="6" fill="#f3f5f9" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">Otros métodos: revisión sistemática de contraste</text><text x="552" y="271" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">(Clarke 2016) n = 1; búsqueda en referencias [pendiente]</text><rect x="60" y="340" width="420" height="70" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="72" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Registros cribados</text><text x="72" y="381" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">(n = 3029)</text><line x1="270" y1="210" x2="270" y2="340" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="330" width="420" height="100" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="352" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Registros excluidos (n = 2805)</text><text x="552" y="371" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Idioma no elegible: n = 312</text><text x="552" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Por título: n = 2447</text><text x="552" y="409" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Por resumen: n = 46</text><line x1="480" y1="375" x2="540" y2="375" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="470" width="420" height="90" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="72" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Informes buscados para recuperación</text><text x="72" y="511" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Estudios primarios: n = 179</text><text x="72" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Reportes de caso (anexo): n = 44</text><line x1="270" y1="410" x2="270" y2="470" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="470" width="420" height="90" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Informes no recuperados</text><text x="552" y="511" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  n = 133 (texto completo no accesible</text><text x="552" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  en acceso abierto desde el entorno)</text><line x1="480" y1="515" x2="540" y2="515" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="620" width="420" height="70" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="72" y="642" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Informes evaluados para elegibilidad</text><text x="72" y="661" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">(n = 46)</text><line x1="270" y1="560" x2="270" y2="620" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="600" width="420" height="190" rx="6" fill="#ffffff" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="622" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Informes excluidos (n = 8)</text><text x="552" y="641" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Reporte de caso único: 1</text><text x="552" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Datos no clínicos/no verificables: 1</text><text x="552" y="679" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Prueba índice no elegible</text><text x="552" y="698" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  (citometría o médula ósea): 3</text><text x="552" y="717" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Datos de LA no separables: 1</text><text x="552" y="736" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Validación técnica sin cohorte: 1</text><text x="552" y="755" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  &lt; 10 pacientes con LA: 1</text><line x1="480" y1="655" x2="540" y2="655" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="960" width="420" height="170" rx="6" fill="#e8f0e0" stroke="#2f3b52" stroke-width="1.5"/><text x="72" y="982" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Estudios incluidos en la revisión</text><text x="72" y="1001" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">(n = 38)</text><text x="72" y="1020" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  F1 frecuencia en LA confirmada: 15</text><text x="72" y="1039" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  F2 LA en cohortes con citopenias: 6</text><text x="72" y="1058" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  D exactitud/comparativo: 7</text><text x="72" y="1077" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  M algoritmos/IA: 10 (2 informes vinculados)</text><line x1="270" y1="690" x2="270" y2="960" stroke="#2f3b52" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="960" width="420" height="110" rx="6" fill="#fbf3e4" stroke="#2f3b52" stroke-width="1.5"/><text x="552" y="982" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b2230">Anexo descriptivo (no en la síntesis)</text><text x="552" y="1001" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Reportes de caso y series &lt; 10: n = 44</text><text x="552" y="1020" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  (16 con texto completo; 28 solo resumen)</text><text x="552" y="1039" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#1b2230">  Metaanálisis: no realizado</text></svg>